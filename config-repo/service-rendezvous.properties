spring.application.name=service-rendezvous
server.port=8083

# Base de donnees H2
spring.datasource.url=jdbc:h2:mem:medrdv_rendezvous
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true

# Client Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123

# BEGIN MEDRDV JALON6
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

resilience4j.retry.instances.service-patients.max-attempts=3
resilience4j.retry.instances.service-patients.wait-duration=500ms
resilience4j.retry.instances.service-patients.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.retry.instances.service-praticiens.max-attempts=3
resilience4j.retry.instances.service-praticiens.wait-duration=500ms
resilience4j.retry.instances.service-praticiens.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

resilience4j.circuitbreaker.instances.service-patients.ignore-exceptions=feign.FeignException$FeignClientException,io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.service-patients.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-patients.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-patients.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-patients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-patients.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.service-patients.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-patients.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.service-praticiens.ignore-exceptions=feign.FeignException$FeignClientException,io.github.resilience4j.bulkhead.BulkheadFullException
resilience4j.circuitbreaker.instances.service-praticiens.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.service-praticiens.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-praticiens.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-praticiens.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-praticiens.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.service-praticiens.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.service-praticiens.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.bulkhead.instances.service-patients.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-patients.max-wait-duration=0ms
resilience4j.bulkhead.instances.service-praticiens.max-concurrent-calls=10
resilience4j.bulkhead.instances.service-praticiens.max-wait-duration=0ms

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG
# END MEDRDV JALON6

# Jalon 6 : debit des consultations enrichies
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms
