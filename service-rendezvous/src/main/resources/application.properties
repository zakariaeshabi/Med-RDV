spring.application.name=service-rendezvous
server.port=8083
spring.config.import=configserver:http://localhost:8888

# Base de donnees H2
spring.datasource.url=jdbc:h2:mem:medrdv_rendezvous
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true

# Client Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Jalon 7 - Kafka producteur
spring.kafka.bootstrap-servers=localhost:9092

# Serialisation de la cle et de l'evenement
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Accuses de reception et idempotence du producteur
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Topic de notification
app.kafka.topic.notification=notification.email.requested

